<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>OG Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;1,9..144,200&family=JetBrains+Mono:wght@400;500&family=Figtree:wght@300;400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background-color: #121110;
        color: #ddd3be;
        font-family: 'Figtree', system-ui, sans-serif;
        font-weight: 300;
        padding: 84px 96px;
        display: flex;
        flex-direction: column;
      }

      /* Ambient glow — same as live site */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 65% 55% at 18% 48%,
          rgba(175, 115, 55, 0.07) 0%,
          transparent 65%
        );
        pointer-events: none;
      }

      /* Grain overlay */
      body::after {
        content: '';
        position: absolute;
        inset: 0;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.88' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='256' height='256' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        pointer-events: none;
      }

      .frame {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .mark {
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #8a8074;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .mark::after {
        content: '';
        display: block;
        width: 56px;
        height: 1px;
        background: rgba(218, 200, 165, 0.13);
      }

      .status {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        letter-spacing: 0.14em;
        color: #c4925a;
      }

      .status::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #8fae72;
        box-shadow: 0 0 0 5px rgba(143, 174, 114, 0.14);
      }

      h1 {
        margin-top: 54px;
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 200;
        font-style: italic;
        font-size: 112px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        color: #ddd3be;
      }

      .role {
        margin-top: 18px;
        font-size: 31px;
        font-weight: 300;
        color: #a89b86;
      }

      .role span {
        color: #c4925a;
      }

      .stack {
        margin-top: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0 20px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        letter-spacing: 0.04em;
        color: #8a8074;
      }

      .stack span:not(:last-child)::after {
        content: '·';
        margin-left: 20px;
        color: #5d564d;
      }

      .foot {
        margin-top: 34px;
        padding-top: 26px;
        border-top: 1px solid rgba(218, 200, 165, 0.09);
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-family: 'JetBrains Mono', monospace;
        font-size: 15px;
        letter-spacing: 0.05em;
        color: #8a8074;
      }

      .foot .url {
        color: #c4925a;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <p class="mark">PORTFOLIO<span class="status">ABERTO A OPORTUNIDADES</span></p>
      <h1>Leonam Duarte</h1>
      <p class="role"><span>@bashln</span> · Desenvolvedor Júnior Full Stack / Frontend</p>
      <p class="stack">
        <span>Go</span><span>JavaScript</span><span>TypeScript</span
        ><span>React</span><span>SQL Oracle</span><span>Linux</span>
      </p>
      <div class="foot">
        <span>Caxias do Sul - RS · Remoto ou híbrido</span>
        <span class="url">bashln.github.io/portfolio</span>
      </div>
    </div>
  </body>
</html>
